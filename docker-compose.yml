name: dialex-orchestrator

networks:
  dialex-net:
    external: true

services:
  orchestrator:
    build: .
    env_file:
      - .env
    environment:
      # Same override pattern as django — compose-internal hostname on the
      # shared platform-infra network, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    ports:
      # Host 8001 was already taken in the monorepo setup — kept at 8010
      # for consistency (container still listens on 8001 internally).
      - "8010:8001"
    networks:
      - dialex-net

  orchestrator-worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    # No host port — a Temporal Worker polls outbound for work, it never
    # accepts inbound connections (spec 0005).
    networks:
      - dialex-net
